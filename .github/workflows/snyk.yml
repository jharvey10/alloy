name: Snyk Monitor Scanning
on:
  release:
    types: [published]
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk-scan-ci:
    uses: grafana/security-github-actions/.github/workflows/snyk_monitor.yml@373ce7d8c3d630ad970ec79b6e9567759005e6a9 # main
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
